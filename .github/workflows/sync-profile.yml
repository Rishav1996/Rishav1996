name: Sync Kinetic GitHub Lab Profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake Animations
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-light.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D Contribution Skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Animated SVGs, Heatmap, Credly, Medium & YouTube
        run: python .github/scripts/sync_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated assets and README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync kinetic profile SVGs, snake, 3D skyline & feeds [skip ci]"
          file_pattern: "README.md assets/*.svg profile-3d-contrib/*.svg"
